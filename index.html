<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para o amor da minha vida ❤️</title>
<style>
    * { box-sizing: border-box; }
    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(135deg, #ffd6e7, #fff0f5);
        font-family: Arial, sans-serif;
        color: #7a2948;
        overflow-x: hidden;
    }
    .card {
        width: min(90%, 520px);
        padding: 35px 25px;
        text-align: center;
        background: rgba(255,255,255,.88);
        border-radius: 25px;
        box-shadow: 0 10px 35px rgba(122,41,72,.18);
    }
    h1 { margin: 0 0 8px; font-size: 28px; }
    h2 { margin: 0 0 25px; font-weight: normal; font-size: 18px; }
    .heart { font-size: 55px; animation: pulse 1.2s infinite; }
    @keyframes pulse {
        50% { transform: scale(1.15); }
    }
    button {
        border: 0;
        padding: 13px 22px;
        border-radius: 30px;
        background: #d94f7d;
        color: white;
        font-size: 16px;
        cursor: pointer;
    }
    #mensagem {
        display: none;
        margin-top: 25px;
        max-height: 280px;
        overflow-y: auto;
        text-align: left;
        line-height: 1.7;
        font-size: 14px;
        padding: 15px;
        background: #fff5f8;
        border-radius: 15px;
    }
    .frase { margin: 0; }
</style>
</head>
<body>
<div class="card">
    <div class="heart">❤️</div>
    <h1>De Helena Elisa</h1>
    <h2>para o amor da minha vida</h2>
    <button onclick="mostrarAmor()">clique aqui ❤️</button>
    <div id="mensagem"></div>
</div>

<script>
function mostrarAmor() {
    const area = document.getElementById("mensagem");
    area.style.display = "block";
    area.innerHTML = "";

    for (let i = 1; i <= 1000; i++) {
        const p = document.createElement("p");
        p.className = "frase";
        p.textContent = i + ". EU TE AMO COM TODO MEU CORAÇÃO, LUCAS! ❤️";
        area.appendChild(p);
    }
}
</script>
</body>
</html>
